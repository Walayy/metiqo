<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <a href="/fr/sports/league-of-legends/international-1/lec-2026-summer-playoffs-t3"
      >LEC 2026 Summer Playoffs</a
    >
    <div id="main-content">
      <div>
        <span><span data-table="time">15:00</span> 11/09/2026</span>
      </div>
      <div role="group" aria-label="GIANTX"><div data-testid="competitor-item"></div></div>
      <div role="group" aria-label="Natus Vincere"><div data-testid="competitor-item"></div></div>
      <div id="tabs"></div>
      <div id="markets"></div>
    </div>
    <script>
      const states = __RECORDED_STATES__;
      const event = states[0].dom;
      const breadcrumb = document.querySelector("a");
      breadcrumb.href = new URL(event.url).pathname.split("/").slice(0, -1).join("/");
      breadcrumb.textContent = event.competition;
      document.querySelectorAll('[role="group"]').forEach((node, index) => {
        node.setAttribute("aria-label", event.participants[index]);
      });
      document.querySelector("[data-table=time]").parentElement.lastChild.textContent =
        " " + event.displayedStart.split(" ")[1];
      let fullScores = false,
        fullHandicap = false;
      const make = (tag, text) => {
        const n = document.createElement(tag);
        if (text) n.textContent = text;
        return n;
      };
      const paint = (state) => {
        const root = document.querySelector("#markets");
        root.replaceChildren();
        for (const m of state.dom.markets) {
          const box = make("div");
          box.className = "secondary-accordion level-2 is-open";
          const head = make("div");
          head.className = "header";
          const title = make("span", m.label);
          title.dataset.dsText = "true";
          head.append(title);
          let items = m.outcomes;
          if (m.label === "Résultat final") {
            const all = make("button", "Tout");
            all.onclick = () => {
              fullScores = true;
              paint(state);
            };
            head.append(all);
            if (!fullScores)
              items = [{ label: "suspended", displayedLabel: "", oddsText: "", disabled: true }];
          }
          box.append(head);
          const content = make("div");
          content.className = "content";
          if (m.label === "Handicap de la carte" && !fullHandicap) items = items.slice(0, 6);
          for (const o of items) {
            const b = make("button");
            b.dataset.testid = "fixture-outcome";
            b.setAttribute("aria-label", o.label);
            b.disabled = o.disabled;
            const name = make("span", o.displayedLabel);
            name.dataset.testid = "outcome-button-name";
            b.append(name);
            const price = make("div", o.oddsText);
            price.dataset.testid = "fixture-odds";
            b.append(price);
            b.onclick = () => window.noteSelection();
            content.append(b);
          }
          if (m.label === "Handicap de la carte" && !fullHandicap) {
            const more = make("div", "Charger Plus");
            more.dataset.testid = "load-more";
            more.onclick = () => {
              fullHandicap = true;
              paint(state);
            };
            content.append(more);
          }
          box.append(content);
          root.append(box);
        }
      };
      for (const s of states) {
        const b = make("button", s.tab);
        b.dataset.testid = s.tab;
        b.onclick = () => setTimeout(() => paint(s), 700);
        document.querySelector("#tabs").append(b);
      }
      paint(states[0]);
      setTimeout(() => {
        document.querySelector("[data-table=time]").textContent =
          event.displayedStart.split(" ")[0];
      }, 100);
    </script>
  </body>
</html>
