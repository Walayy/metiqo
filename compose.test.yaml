services:
  backend-tests:
    image: metiquo-test:local
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile, target: test }
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://metiquo:${POSTGRES_PASSWORD}@db:5432/metiquo_loltv_test
      TEST_API_PASSWORD: ${METIQUO_API_PASSWORD}
    volumes:
      - ./apps/api:/app/apps/api:ro
      - ./apps/worker:/app/apps/worker:ro
      - ./packages/core:/app/packages/core:ro
      - ./migrations:/app/migrations:ro
      - ./tests/backend:/app/tests/backend:ro
    networks: [database]
    profiles: [test]
