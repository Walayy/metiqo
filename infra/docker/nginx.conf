worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location = /health { access_log off; return 200 'ok'; }
        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 8k;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            error_page 502 504 =503 @api_unavailable;
        }
        location @api_unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "30" always;
            return 503 '{"detail":"Le service est momentanément indisponible."}';
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
        location = /index.html { add_header Cache-Control "no-cache" always; }
        location / {
            add_header Cache-Control "no-cache" always;
            error_page 404 /index.html;
            try_files $uri =404;
        }
    }
}
