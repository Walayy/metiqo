project: Metiquo
source_of_truth: 00_SFG_METIQUO.md
rules:
- La SFG est normative; le plan ne peut pas la contredire.
- Un ticket n’est DONE que lorsque ses critères et tests ont réellement passé.
- Aucun scraper Stake, contournement anti-bot/geoblocage/CAPTCHA ni pari réel automatisé.
- Oracle’s Elixir est l’unique source statistique LoL.
- Mock et réel partagent DTO/endpoints/composants.
- Raw, odds, predictions, signals, paper bets, evaluations publiées et audit sont immuables/append-only selon la SFG.
- Toute feature respecte le cutoff temporel.
- Aucune infrastructure distribuée lourde au MVP sans ADR et besoin mesuré.
phases:
- id: P0
  name: Garde-fous et fondations
  objective: Rendre le dépôt reproductible, Dockerisé et strict avant toute logique métier.
- id: P1
  name: Contrats, mock et interface
  objective: Livrer une démonstration complète sans aucune source externe, avec les mêmes contrats que le réel.
- id: P2
  name: Oracle's Elixir
  objective: Rendre l'historique LoL reproductible, versionné, idempotent, observable et sûr.
- id: P3
  name: Canonique LoL et features as-of
  objective: Transformer le raw en données métier puis en features strictement antérieures au cutoff.
- id: P4
  name: ML game winner et pricing indépendant
  objective: Produire des probabilités calibrées, incertaines et reproductibles, sans utiliser la cote comme feature.
- id: P5
  name: Cotes et résolution d'entités
  objective: Recevoir des cotes autorisées, immuables et les mapper sans ambiguïté aux événements LoL.
- id: P6
  name: Value engine et opportunités
  objective: Comparer prix modèle et prix marché, appliquer les garde-fous et accepter l'abstention.
- id: P7
  name: Paper trading et règlement
  objective: Mesurer honnêtement les performances à partir de cotes réellement observées.
- id: P8
  name: Operations et sécurité
  objective: Fiabiliser jobs, audit, sauvegarde, restauration, sécurité réseau et observabilité.
- id: P9
  name: Durcissement et recette MVP
  objective: Prouver que la Definition of Done de la SFG est satisfaite de bout en bout.
- id: P10
  name: Marchés LoL supplémentaires
  objective: Ajouter les marchés uniquement derrière le capability registry et après validation statistique.
- id: P11
  name: SaaS et multi-jeux — bloqués
  objective: Préparer les extensions sans les activer avant levée des portes conformité/licence.
