name: Runtimes verrouillés
description: Installer les versions du dépôt et leurs dépendances figées
inputs:
  chromium:
    description: Installer Chromium et ses bibliothèques système
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        run_install: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: .node-version
        package-manager-cache: false
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.11.23
        enable-cache: true
        cache-dependency-glob: uv.lock
    - shell: bash
      run: |
        uv python install 3.13.14
        uv sync --frozen
        pnpm install --frozen-lockfile
    - if: inputs.chromium == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
