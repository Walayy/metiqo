name: Exercice de restauration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://metiquo:metiquo@127.0.0.1:5432/metiquo
      TEST_PG_CONTAINER: metiquo-restore-drill
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Installer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.23
      - name: Installer les outils
        run: |
          uv python install 3.13.14
          uv sync --frozen
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y age
      - name: Démarrer la même image PostgreSQL que la release
        run: |
          docker compose build postgres
          docker run -d --name "$TEST_PG_CONTAINER" -e POSTGRES_USER=metiquo -e POSTGRES_PASSWORD=metiquo -e POSTGRES_DB=metiquo -e TZ=UTC -p 127.0.0.1:5432:5432 metiquo-postgres:local
          for attempt in $(seq 1 30); do docker exec "$TEST_PG_CONTAINER" pg_isready -U metiquo && break; sleep 1; done
          docker exec "$TEST_PG_CONTAINER" pg_isready -U metiquo
      - name: Restaurer et reconstruire en clair et chiffré
        run: uv run --frozen pytest tests/operations tests/integration/test_restore.py --junitxml=test-results/restore-drill.xml
      - name: Refuser un exercice incomplet
        run: uv run --frozen python infra/scripts/verify_release_evidence.py junit test-results/restore-drill.xml
      - name: Conserver le résultat de l'exercice
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-drill
          path: test-results/restore-drill.xml
          retention-days: 30
      - name: Supprimer la base de cet exercice
        if: always()
        run: docker rm -f "$TEST_PG_CONTAINER"
