[project]
name = "metiquo-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core"]

[dependency-groups]
dev = [
  "metiquo-api",
  "metiquo-worker",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-croniter>=6.2.4.20260711",
]

[tool.uv.sources]
metiquo-api = { workspace = true }
metiquo-worker = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
packages = ["metiquo_core", "metiquo_api", "metiquo_worker"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
markers = ["integration: requires TEST_DATABASE_URL pointing to an isolated migrated database"]
