<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101211" />
    <meta
      name="description"
      content="Metiquo — analysez les values sur League of Legends et suivez l’évolution des cotes Stake."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Les values · Metiquo</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('metiquo:theme') || 'system';
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* Critical paint: available before the JavaScript and application CSS. */
      :root {
        --boot-bg: #f6f7f5;
        --boot-brand: #263b22;
        --boot-ink: #f2f9ed;
        --boot-track: #d8dfd3;
      }
      :root[data-theme='dark'] {
        --boot-bg: #111411;
        --boot-brand: #c2eea7;
        --boot-ink: #1b2715;
        --boot-track: #3b4437;
      }
      html {
        background: var(--boot-bg);
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
      }
      .boot-symbol {
        display: grid;
        justify-items: center;
        gap: 28px;
        color: var(--boot-brand);
        animation: boot-arrive 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-symbol svg {
        width: 56px;
        height: 56px;
      }
      .boot-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2px solid var(--boot-track);
        border-top-color: var(--boot-brand);
        border-radius: 50%;
        animation: boot-spin 1.1s linear infinite;
      }
      .boot-splash[data-ready] {
        pointer-events: none;
        animation: boot-leave 360ms ease-out both;
      }
      @keyframes boot-arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-leave {
        to {
          opacity: 0;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-symbol,
        .boot-spinner {
          animation: none;
        }
        .boot-splash[data-ready] {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Chargement de Metiquo">
      <div class="boot-symbol" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="56" height="56">
          <rect width="48" height="48" rx="13" fill="currentColor" />
          <path d="M10 33V15h6l8 10 8-10h6v18h-7V25l-7 8-7-8v8z" fill="var(--boot-ink)" />
        </svg>
        <span class="boot-spinner"></span>
      </div>
    </div>
    <div id="root" inert></div>
    <noscript
      >Activez JavaScript pour ouvrir Metiquo.<style>
        .boot-splash {
          display: none;
        }
      </style></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
