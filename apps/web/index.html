<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101211" />
    <meta
      name="description"
      content="Metiquo — suivez les matchs League of Legends, les cotes Stake et les values esport."
    />
    <link
      id="brand-favicon"
      rel="icon"
      type="image/x-icon"
      href="/brand/light/favicon.ico"
      sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256"
    />
    <link
      id="brand-touch-icon"
      rel="apple-touch-icon"
      sizes="180x180"
      href="/brand/light/apple-touch-icon.png"
    />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Matchs · Metiquo</title>
    <script>
      (() => {
        let preference = 'system';
        try {
          preference = localStorage.getItem('metiquo:theme') || 'system';
        } catch {}
        const dark =
          preference === 'dark' ||
          (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        const theme = dark ? 'dark' : 'light';
        document.getElementById('brand-favicon').href = `/brand/${theme}/favicon.ico`;
        document.getElementById('brand-touch-icon').href = `/brand/${theme}/apple-touch-icon.png`;
        document.querySelector('meta[name="theme-color"]').content = dark ? '#111411' : '#f6f7f5';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <style>
      /* Critical paint: available before the JavaScript and application CSS. */
      :root {
        --boot-bg: #f6f7f5;
        --boot-brand: #263b22;
        --boot-ink: #f2f9ed;
        --boot-track: #d8dfd3;
      }
      :root[data-theme='dark'] {
        --boot-bg: #111411;
        --boot-brand: #c2eea7;
        --boot-ink: #1b2715;
        --boot-track: #3b4437;
      }
      html {
        background: var(--boot-bg);
        scrollbar-gutter: stable;
      }
      body {
        margin: 0;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: grid;
        place-items: center;
        background: var(--boot-bg);
      }
      .boot-symbol {
        display: grid;
        justify-items: center;
        gap: 28px;
        color: var(--boot-brand);
        animation: boot-arrive 600ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-brand-mark {
        display: block;
        width: 80px;
        height: 80px;
        border-radius: 16px;
        overflow: hidden;
      }
      .boot-brand-mark img {
        display: block;
        width: 80px;
        height: 80px;
      }
      .boot-brand-mark .brand-dark {
        display: none;
      }
      :root[data-theme='dark'] .boot-brand-mark .brand-light {
        display: none;
      }
      :root[data-theme='dark'] .boot-brand-mark .brand-dark {
        display: block;
      }
      .boot-spinner {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border: 2px solid var(--boot-track);
        border-top-color: var(--boot-brand);
        border-radius: 50%;
        animation: boot-spin 1.1s linear infinite;
      }
      .boot-splash[data-ready] {
        pointer-events: none;
        animation: boot-leave 360ms ease-out both;
      }
      .boot-failure {
        display: none;
        box-sizing: border-box;
        max-width: 560px;
        padding: 32px 24px;
        margin: 16px;
        color: var(--boot-brand);
        font:
          15px/1.7 system-ui,
          sans-serif;
      }
      .boot-failure h1 {
        font-size: 28px;
        line-height: 1.3;
      }
      .boot-failure h1:focus {
        outline: none;
      }
      .boot-failure nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
      .boot-failure a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--boot-track);
        border-radius: 10px;
        color: inherit;
        font: inherit;
        text-decoration: none;
      }
      .boot-failure a:focus-visible {
        outline: 3px solid var(--boot-brand);
        outline-offset: 4px;
      }
      .boot-splash[data-failed] .boot-symbol {
        display: none;
      }
      .boot-splash[data-failed] .boot-failure {
        display: block;
      }
      @keyframes boot-arrive {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-leave {
        to {
          opacity: 0;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-symbol,
        .boot-spinner {
          animation: none;
        }
        .boot-splash[data-ready] {
          animation-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="Chargement de Metiquo">
      <div class="boot-symbol" aria-hidden="true">
        <span class="boot-brand-mark">
          <picture class="brand-light"
            ><source
              type="image/webp"
              srcset="/brand/light/mark-128.webp 128w, /brand/light/mark-256.webp 256w"
              sizes="80px" />
            <img
              src="/brand/light/mark-128.png"
              srcset="/brand/light/mark-128.png 128w, /brand/light/mark-256.png 256w"
              sizes="80px"
              width="80"
              height="80"
              alt=""
              fetchpriority="high"
          /></picture>
          <picture class="brand-dark"
            ><source
              type="image/webp"
              srcset="/brand/dark/mark-128.webp 128w, /brand/dark/mark-256.webp 256w"
              sizes="80px" />
            <img
              src="/brand/dark/mark-128.png"
              srcset="/brand/dark/mark-128.png 128w, /brand/dark/mark-256.png 256w"
              sizes="80px"
              width="80"
              height="80"
              alt=""
              fetchpriority="high"
          /></picture>
        </span>
        <span class="boot-spinner"></span>
      </div>
      <section class="boot-failure" aria-labelledby="boot-failure-title">
        <strong>metiquo.</strong>
        <h1 id="boot-failure-title" tabindex="-1">Le chargement est interrompu.</h1>
        <p>
          Metiquo n’a pas pu démarrer. Vérifiez votre connexion, puis rechargez cette page. Si le
          problème persiste, réessayez plus tard.
        </p>
        <nav aria-label="Reprendre la navigation">
          <a href="" id="boot-reload">Recharger la page</a><a href="/">Retour aux matchs</a>
        </nav>
      </section>
    </div>
    <div id="root" inert></div>
    <noscript
      ><main class="boot-failure" style="display: block; margin: 15vh auto">
        <strong>metiquo.</strong>
        <h1>JavaScript est désactivé.</h1>
        <p>
          Metiquo a besoin de JavaScript pour afficher les données et vérifier votre connexion.
          Activez-le dans votre navigateur, puis rechargez cette page.
        </p>
        <nav aria-label="Reprendre la navigation"><a href="">Recharger la page</a></nav>
      </main>
      <style>
        .boot-splash {
          display: none;
        }
      </style></noscript
    >
    <script type="module" id="app-entry" src="/src/main.tsx"></script>
    <script>
      (() => {
        function showFailure() {
          const splash = document.getElementById('boot-splash');
          if (!splash || splash.dataset.ready) return;
          splash.dataset.failed = 'true';
          splash.removeAttribute('aria-label');
          splash.setAttribute('role', 'region');
          document.getElementById('boot-failure-title')?.focus();
        }
        const timer = setTimeout(showFailure, 15000);
        document.querySelectorAll('script[type="module"][src]').forEach((entry) => {
          entry.addEventListener('error', showFailure);
        });
        document.getElementById('boot-reload').addEventListener('click', (event) => {
          event.preventDefault();
          location.reload();
        });
        window.addEventListener('metiquo:ready', () => clearTimeout(timer), { once: true });
      })();
    </script>
  </body>
</html>
